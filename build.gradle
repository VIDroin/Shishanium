plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = mod_version
 group = mod_group_id

repositories { mavenCentral() }

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = 'info' }
    client { }
    server { programArgument '--nogui' }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

processResources {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version: neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                             mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                             mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}
